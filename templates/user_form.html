<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Form</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #e0e7ff, #f8fafc);
        color: #1e293b;
      }

      .form-card {
        width: min(100%, 420px);
        padding: 32px;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 16px 40px rgba(30, 41, 59, 0.14);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.75rem;
      }
      p {
        margin: 0 0 24px;
        color: #64748b;
      }

      .field {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        font-size: 0.9rem;
        font-weight: 700;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font: inherit;
        outline: none;
      }

      input:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.18);
      }

      button {
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: #4f46e5;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #4338ca;
      }
    </style>
  </head>
  <body>
    <main class="form-card">
      <h1>User details</h1>
      <p>Please enter your information below.</p>

      <form action="{% url 'submit_form' %}" method="post">
        {% csrf_token %}
        <div class="field">
          <label for="name">Name</label>
          <input
            id="name"
            name="name"
            type="text"
            placeholder="Enter your name"
            required
          />
        </div>

        <div class="field">
          <label for="department">Department</label>
          <input
            id="department"
            name="department"
            type="text"
            placeholder="Enter your department"
            required
          />
        </div>

        <button type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
